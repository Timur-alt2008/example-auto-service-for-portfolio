nce on every ride",topline:"EXAMPLE Auto Service | Car maintenance and repair"},fe={address:"42 Test Street, Evergreen",phoneDisplay:"+380 00 123 45 67",phoneHref:"tel:+380001234567",email:"contact@example-auto.invalid",routeUrl:"",hours:[{days:"Monday \u2013 Friday",time:"09:00\u201319:00",open:9,close:19,weekdays:[1,2,3,4,5]},{days:"Saturday",time:"10:00\u201316:00",open:10,close:16,weekdays:[6]},{days:"Sunday",time:"closed",open:0,close:0,weekdays:[0]}]},ei="UAH",ti=[{id:"top",label:"Home"},{id:"services",label:"Services"},{id:"prices",label:"Prices"},{id:"works",label:"Our work"},{id:"about",label:"About"},{id:"contacts",label:"Contacts"}],Jl=[{id:"diagnostics",title:"Computer diagnostics",short:"We read fault codes and sensor data to understand where to start looking for the cause.",includes:["Connecting a diagnostic scanner and reading fault codes","Viewing live sensor readings","Inspecting components related to the fault","Conclusion and a list of recommended work"],priceFrom:500,priceNote:"scan and conclusion",scene:"diagnostics",photo:"service-diagnostics",details:"A fault code points to an area to investigate, but it is not a diagnosis by itself. That is why, after reading the codes, the technician checks the related components and only then proposes a list of work."},{id:"oil",title:"Oil and filter change",short:"Scheduled maintenance according to the car\u2019s service schedule: oil, oil filter and other filters.",includes:["Draining the used oil and replacing the oil filter","Filling with oil that meets the manufacturer\u2019s specifications","Checking the level and looking for leaks after start-up","Replacing the air and cabin filters if needed"],priceFrom:400,priceNote:"labour only, oil and filters not included",scene:"oil",photo:"service-oil",details:"Oil specifications and volume depend on the specific car. The choice is agreed in advance; you can follow the service book or the owner\u2019s manual."},{id:"brakes",title:"Brake system repair",short:"Pads, discs, brake fluid, hoses and calipers \u2014 from inspection to a final check.",includes:["Inspecting and measuring pad and disc wear","Replacing pads and discs based on the inspection","Checking brake fluid, hoses and calipers","Final brake check after the repair"],priceFrom:700,priceNote:"labour per axle, parts not included",scene:"brakes",photo:"service-brakes",details:"Brakes are a safety matter. If the pedal feels softer, the stopping distance has increased, or you hear grinding or feel vibration, do not postpone the check."},{id:"suspension",title:"Suspension diagnostics and repair",short:"We find the source of knocks and play and agree on replacing worn parts.",includes:["Suspension inspection on a lift","Checking shock absorbers, mounts, ball joints and bushings","Agreeing on the list of necessary work","Replacing worn parts and a test drive"],priceFrom:null,scene:"suspension",photo:"service-suspension",details:"The scope of work depends on which parts are worn. The cost is quoted after the inspection and agreed before the repair starts."},{id:"engine",title:"Engine repair",short:"Finding the cause of unstable running and an agreed repair \u2014 no \u201Cjust in case\u201D work.",includes:["Diagnostics and inspection of systems that affect engine operation","A detailed explanation of the causes found","Agreeing on the repair plan and cost","Repair and a check of the result"],priceFrom:null,scene:"engine",photo:"service-engine",details:"Engine repair starts with diagnostics. The scope and cost depend on the car and the fault found, so an exact price cannot be given in advance."},{id:"cooling",title:"Cooling system service",short:"Coolant replacement, plus a check of the radiator, hoses and water pump.",includes:["Checking the condition of the coolant","Replacing the fluid and bleeding air from the system","Inspecting the radiator, hoses and mounts","Checking the system for leaks"],priceFrom:600,priceNote:"labour only, coolant not included",scene:"cooling",photo:"service-cooling",details:"The coolant type is stated in the car\u2019s owner\u2019s manual. Mixing different types without checking compatibility is not recommended."},{id:"ac",title:"Air conditioning service",short:"System check, leak test, recharge and cabin filter replacement.",includes:["Checking A/C operation and system pressure","Leak test","Refrigerant recharge and outlet temperature check","Replacing the cabin filter if needed"],priceFrom:900,priceNote:"check and recharge, leak search not included",scene:"ac",photo:"service-ac",details:"If the system is losing refrigerant, a recharge only helps temporarily. Finding and fixing the leak is a separate job, and its cost is quoted after the check."},{id:"battery",title:"Battery replacement",short:"Battery and charging system check, replacement and disposal of the old battery.",includes:["Checking the condition of the battery and alternator","Removing the old battery and installing a new one","Cleaning the terminals and checking the mounts","Checking the electrical equipment after replacement"],priceFrom:200,priceNote:"labour only, battery not included",scene:"battery",photo:"service-battery",details:"It is worth checking the alternator before replacing: weak charging will quickly ruin a new battery too."},{id:"alignment",title:"Wheel alignment",short:"Measuring and adjusting wheel angles for straight tracking and even tyre wear.",includes:["Preliminary inspection of the suspension and steering","Measuring wheel alignment angles","Adjustment within the car\u2019s tolerances","Printout of results before and after adjustment"],priceFrom:800,priceNote:"labour, all four wheels",scene:"alignment",photo:"service-alignment",details:"If the suspension is worn, adjustment alone cannot give a stable result \u2014 the technician will suggest fixing the fault first."},{id:"parts",title:"Parts selection and installation",short:"We will select parts based on your car\u2019s details or install the ones you bring.",incl
